name: AI Control Center tests

on:
  pull_request:
    paths:
      - "ai-control-center/**"
      - ".github/workflows/ai-control-center.yml"
  push:
    branches: [main]
    paths:
      - "ai-control-center/**"
      - ".github/workflows/ai-control-center.yml"

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r ai-control-center/requirements.txt
      - name: Run unit tests
        working-directory: ai-control-center
        run: python -m unittest discover -s tests -v
