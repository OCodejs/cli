name: AI Control Center tests

on:
  pull_request:
    branches: [main]
    paths:
      - "ai-control-center/**"
      - ".github/workflows/ai-control-center.yml"
  push:
    branches: [main]
    paths:
      - "ai-control-center/**"
      - ".github/workflows/ai-control-center.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-control-center-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-control-center/requirements.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r ai-control-center/requirements.txt
      - name: Run unit tests
        working-directory: ai-control-center
        run: python -m unittest discover -s tests -v
