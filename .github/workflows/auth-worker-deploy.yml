name: Deploy Auth Worker

on:
  push:
    branches:
      - main
    paths:
      - "examples/auth-worker-typescript/**"
      - ".github/workflows/auth-worker-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-auth-worker-production
  cancel-in-progress: false

jobs:
  test:
    name: Test Auth Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/auth-worker-typescript
    steps:
      - name: Checkout merged main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: examples/auth-worker-typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Worker typecheck and Vitest
        run: npm test

      - name: Run frontend typecheck
        run: npm run test:frontend

  deploy:
    name: Deploy Cloudflare Worker
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://auth.ocodejs.dev
    defaults:
      run:
        working-directory: examples/auth-worker-typescript
    steps:
      - name: Checkout merged main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: examples/auth-worker-typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Deploy with Wrangler
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
